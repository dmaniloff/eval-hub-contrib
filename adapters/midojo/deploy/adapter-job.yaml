# Standalone cluster run of the MiDojo adapter (Option C, HTTP transport).
#
# Runs the adapter as a one-shot Job in the `openshell` namespace. Unlike the
# old bundled adapter, this job starts NOTHING long-lived: it only runs the
# orchestrator (midojo-run --protocol http), which drives the remote agent over
# HTTP and grades against the operator-managed control plane. Both endpoints are
# in-cluster Services that must already be up:
#
#   * control plane  — the operator's midojo companion Deployment/Service,
#     created from the EvalHub CR (spec.midojo.enabled: true). Default Service:
#     evalhub-midojo.openshell.svc.cluster.local:8080
#   * agent          — the eval_hub_suite HTTP-wrapped pi agent, deployed from
#     the midojo repo (suites/eval_hub_suite/pi_agent/deploy). Default Service:
#     eval-hub-suite-agent.openshell.svc.cluster.local:8000
#
# Prereq:  the adapter image is pushed to the internal registry
#          (openshell/community-midojo:dev), the EvalHub CR has the midojo
#          control plane enabled, and the agent Deployment (with its LLM-creds
#          Secret) is running.
#
# Apply:   oc apply -f adapter-job.yaml
# Re-run:  oc delete job midojo-eval-hub-suite -n openshell --ignore-not-found && oc apply -f adapter-job.yaml
# Logs:    oc logs -n openshell -f job/midojo-eval-hub-suite
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: midojo-job-spec
  namespace: openshell
data:
  # The eval-hub JobSpec the adapter reads from EVALHUB_JOB_SPEC_PATH (/meta/job.json).
  # For the http protocol the model endpoint and callback_url are not on the
  # critical path: the agent's model is configured on the agent Deployment, and a
  # failed callback is non-fatal (results are logged and written to
  # /tmp/midojo_runs/<id>/results.json). The control plane and agent URLs are
  # supplied via env on the Job (MIDOJO_CONTROL_URL / MIDOJO_AGENT_URI) below.
  job.json: |
    {
      "id": "midojo-eval-hub-suite-cluster-001",
      "provider_id": "midojo",
      "benchmark_id": "eval_hub_suite",
      "benchmark_index": 0,
      "model": {
        "url": "https://maas-rhdp.apps.maas.redhatworkshops.io/v1",
        "name": "qwen36-35b-a3b"
      },
      "parameters": {},
      "callback_url": "http://localhost:8080",
      "num_examples": null,
      "experiment_name": "midojo-eval-hub-suite-cluster",
      "tags": [
        {"framework": "midojo"},
        {"evaluation_type": "prompt_injection"}
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: midojo-eval-hub-suite
  namespace: openshell
spec:
  backoffLimit: 0            # one shot; do not retry a failed red-team run
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: midojo-adapter
    spec:
      restartPolicy: Never
      containers:
        - name: adapter
          image: image-registry.openshift-image-registry.svc:5000/openshell/community-midojo:dev
          imagePullPolicy: Always   # re-pull the mutable :dev tag on every run
          env:
            - name: HOME
              value: /tmp
            - name: LOG_LEVEL
              value: INFO
            - name: EVALHUB_JOB_SPEC_PATH
              value: /meta/job.json
            # Operator-managed control plane (midojo-serve) and the remote agent
            # under test — both in-cluster Service DNS addresses.
            - name: MIDOJO_CONTROL_URL
              value: http://evalhub-midojo.openshell.svc.cluster.local:8080
            - name: MIDOJO_AGENT_URI
              value: http://eval-hub-suite-agent.openshell.svc.cluster.local:8000
          volumeMounts:
            - name: job-spec
              mountPath: /meta
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: job-spec
          configMap:
            name: midojo-job-spec
            items:
              - key: job.json
                path: job.json
